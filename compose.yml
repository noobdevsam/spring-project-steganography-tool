services:
    db-mysql:
        image: mysql:latest
        container_name: db-mysql
        ports:
            - "3306:3306"
        environment:
            - MYSQL_ROOT_PASSWORD=password
            - MYSQL_DATABASE=stego
            - MYSQL_USER=user
            - MYSQL_PASSWORD=password
        volumes:
            - mysql_data:/var/lib/mysql

volumes:
    mysql_data:
        driver: local
        