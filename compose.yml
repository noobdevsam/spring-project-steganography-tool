services:
    # Database Service
    db-mysql:
        image: mysql:latest
        container_name: db-mysql
        ports:
            - "3306:3306"
        environment:
            - MYSQL_ROOT_PASSWORD=password
            - MYSQL_DATABASE=stego
            - MYSQL_USER=user
            - MYSQL_PASSWORD=password
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - stego-network

    # Application Service
    stego-app:
        # Use the image built by the Spring Boot Maven plugin
        image: noobdevsam/spring-project-steganography-tool:v1
        container_name: stego-app
        ports:
            - "8080:8080"
        mem_limit: 2g
        user: "0:0"  # Run as root user initially
        environment:
            # Connect to the MySQL container
            - DATABASE_URL=jdbc:mysql://db-mysql:3306/stego
            - DATABASE_USER=user
            - DATABASE_PASSWORD=password
            # Point storage inside the container to the mounted volume
            - STORAGE_BASE_PATH=/app/storage
            # Other environment variables as needed
            - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75.0
        volumes:
            - stego_storage:/app/storage
        command: >
            sh -c "
            mkdir -p /app/storage &&
            chown -R 1000:1000 /app/storage &&
            chmod -R 755 /app/storage &&
            cd /workspace &&
            exec setpriv --reuid=1000 --regid=1000 --clear-groups java org.springframework.boot.loader.launch.JarLauncher
            "
        networks:
            - stego-network
        depends_on:
            - db-mysql

networks:
    stego-network:
        driver: bridge

volumes:
    mysql_data:
        driver: local
    stego_storage:
        driver: local
