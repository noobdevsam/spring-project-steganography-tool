services:
    # Database Service
    db-mysql:
        image: mysql:latest
        container_name: db-mysql
        ports:
            - "3306:3306"
        environment:
            - MYSQL_ROOT_PASSWORD=password
            - MYSQL_DATABASE=stego
            - MYSQL_USER=user
            - MYSQL_PASSWORD=password
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - stego-network

    # Application Service
    app:
        # Use the image built by the Spring Boot Maven plugin
        image: docker.io/noobdevsam/spring-project-steganography-tool:0.0.1-SNAPSHOT
        container_name: stego-app
        ports:
            - "8080:8080"
        environment:
            # --- JVM Memory Configuration ---
            # Set initial and maximum heap size for the JVM
            - JAVA_TOOL_OPTIONS=-Xms512m -Xmx2g

            # Connect to the MySQL container
            - DATABASE_URL=jdbc:mysql://db-mysql:3306/stego
            - DATABASE_USER=user
            - DATABASE_PASSWORD=password
            # Point storage inside the container to the mounted volume
            - STORAGE_BASE_PATH=/app/storage
        volumes:
            # Mount the local storage directory into the container to persist files
            - storage_data:/app/storage
        networks:
            - stego-network
        depends_on:
            - db-mysql

networks:
    stego-network:
        driver: bridge

volumes:
    mysql_data:
        driver: local
    storage_data:
        driver: local
